[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent-persistent-memory"
version = "0.1.0"
description = "Agente de razonamiento ciclico (ReAct) con memoria persistente via checkpointer SQLite"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Thiago Serratto" }]
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "aiosqlite>=0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.15",
    "pyright>=1.1.408",
    "build>=1.3",
]

[tool.setuptools]
py-modules = ["settings", "tools", "agent", "run_demo"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.coverage.run]
branch = true
source = ["settings", "tools", "agent", "run_demo"]

[tool.coverage.report]
fail_under = 80
